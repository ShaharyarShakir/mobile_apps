[project]
name = "image_gallery"
version = "0.1.0"
type = "android-app"
kotlin_version = "2.1.0"
gradle_version = "8.9"
agp_version = "8.6.1"

[android]
application_id = "com.example.imagegallery"
min_sdk = 24
target_sdk = 36
compile_sdk = 36
namespace = "com.example.imagegallery"

[repositories]
maven_central = true
google = true
gradle_plugin_portal = false

[dependencies]
coreKtx = "androidx.core:core-ktx:1.10.1"
appcompat = "androidx.appcompat:appcompat:1.6.1"
material = "com.google.android.material:material:1.11.0"
composeBom = "androidx.compose:compose-bom:2024.12.01"
composeUi = "androidx.compose.ui:ui"
composeUiToolingPreview = "androidx.compose.ui:ui-tooling-preview"
composeMaterial3 = "androidx.compose.material3:material3"
composeFoundation = "androidx.compose.foundation:foundation"
composeRuntime = "androidx.compose.runtime:runtime"
activityCompose = "androidx.activity:activity-compose:1.8.2"

