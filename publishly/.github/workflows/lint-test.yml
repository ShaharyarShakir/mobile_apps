name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend CI (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          cd backend
          uv sync

      - name: Run Ruff Lint Check
        run: |
          cd backend
          uv run ruff check .

      - name: Run Ruff Format Check
        run: |
          cd backend
          uv run ruff format --check .

      - name: Run Mypy Typecheck
        run: |
          cd backend
          uv run mypy app

      - name: Run Backend Tests
        run: |
          cd backend
          # Run tests with mock env vars if needed or define them in env block
          uv run pytest -v
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postpilot
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: testing
          SECRET_KEY: testingsecretkey12345678901234567890

  mobile:
    name: Mobile CI (Expo & Bun)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          cd mobile
          bun install --frozen-lockfile

      - name: Run ESLint
        run: |
          cd mobile
          bun run lint

      - name: Verify TypeScript compilation
        run: |
          cd mobile
          bun tsc --noEmit
