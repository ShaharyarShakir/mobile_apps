name: study-better-t

services:
  postgres:
    image: postgres
    container_name: study-better-t-postgres
    environment:
      POSTGRES_DB: study-better-t
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - study-better-t_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  study-better-t_postgres_data:
