name: CI


on:
 push:
  branches:
   - main


jobs:

 backend:

  runs-on: ubuntu-latest

  steps:

  - uses: actions/checkout@v4

  - uses: actions/setup-go@v5

    with:

     go-version: "1.25"


  - run:
      go test ./backend/...


 mobile:

  runs-on: ubuntu-latest

  steps:

  - uses: actions/checkout@v4

  - uses: actions/setup-node@v4

  - run:
      |
      cd mobile
      npm install
      npm run lint